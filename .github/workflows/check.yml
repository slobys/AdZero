name: Offline checks
on:
  push:
    branches: [main]
    paths: ['luci-app-adzero/**', 'scripts/**', 'tests/**', '.github/workflows/check.yml']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-release-text:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check delivered release bytes under Windows newline defaults
        run: python -m unittest discover -s tests -p test_release.py -v
  check:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        shell: [sh, openwrt-ash]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check with sh
        if: matrix.shell == 'sh'
        run: sh scripts/check.sh
      - name: Check with official OpenWrt BusyBox ash
        if: matrix.shell == 'openwrt-ash'
        run: |
          sudo apt-get update && sudo apt-get install -y ruby
          curl -fL https://github.com/mikefarah/yq/releases/download/v4.54.1/yq_linux_amd64 -o /tmp/yq
          echo '8e34fc298390875de416e6a4afcb8cabeceb25d9aa8506c1a2f9353cf702ea5f  /tmp/yq' | sha256sum -c -
          sudo install -m 755 /tmp/yq /usr/local/bin/yq
          python3 scripts/check_openwrt_runtime.py
          python3 scripts/check_opkg_inventory.py
          sudo python3 scripts/check_rpc.py
          sudo python3 scripts/check_proxy_runtime.py
          sudo python3 scripts/check_update_runtime.py
          sudo python3 scripts/check_passwall_runtime.py
          sudo python3 scripts/check_dns_pool_runtime.py
          sudo python3 scripts/check_openclash_runtime.py
          sudo python3 scripts/check_observe_runtime.py
          sudo python3 scripts/check_source_cache.py
          sudo python3 scripts/check_nailink_gateway.py
          # Isolated root checks share core downloads with runner-owned checks.
          sudo chown -R "$(id -u):$(id -g)" artifacts .sdk
          python3 scripts/check_large_rules.py
          export ADZERO_UCODE="$PWD/.sdk/runtime-24.10.8/libc.so --library-path $PWD/.sdk/runtime-24.10.8 $PWD/.sdk/runtime-24.10.8/ucode -L $PWD/.sdk/runtime-24.10.8"
          python3 scripts/check_dns_core.py
          python3 scripts/check_capacity_scale.py
          python3 scripts/check_dae.py
          python3 scripts/check_routing_dae.py
          python3 scripts/check_routing_data.py
          sudo python3 scripts/check_routing_core.py
          sudo python3 scripts/check_dns_guard_runtime.py
          sudo chown -R "$(id -u):$(id -g)" artifacts .sdk
          export PATH="$PWD/.sdk/runtime-24.10.8/wrappers:$PATH"
          python3 scripts/check_rule_source.py
          python3 scripts/check_source_catalog.py
          export ADZERO_TEST_SHELL="$PWD/.sdk/runtime-24.10.8/libc.so --library-path $PWD/.sdk/runtime-24.10.8 $PWD/.sdk/runtime-24.10.8/busybox ash"
          python3 scripts/check_backend_hooks.py
